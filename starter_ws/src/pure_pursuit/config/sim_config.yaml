pure_pursuit:
  ros__parameters:
    # The launch file overrides this with the installed Levine waypoint path.
    waypoints_path: "set_by_launch_file"
    odom_topic: "/ego_racecar/odom"
    car_refFrame: "ego_racecar/base_link"
    global_refFrame: "map"
    drive_topic: "/drive"
    rviz_current_waypoint_topic: "/current_waypoint"
    rviz_lookahead_waypoint_topic: "/lookahead_waypoint"

    # Conservative kickstart tuning validated on the Levine map.
    min_lookahead: 1.0
    max_lookahead: 1.2
    lookahead_ratio: 8.0
    K_p: 0.12
    steering_limit: 25.0
    velocity_percentage: 0.2

waypoint_visualizer_node:
  ros__parameters:
    # The launch file overrides this with the installed Levine waypoint path.
    waypoints_path: "set_by_launch_file"
    rviz_waypoints_topic: "/waypoints"

